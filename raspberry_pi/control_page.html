<header class="topbar"><img class="competition" src="/static/dashboard/competition.png" alt="2017–2026 FPGA创新设计竞赛 国赛十周年"><div class="brand"><h1>智行者</h1><span class="dash">—</span><span class="subtitle">FPGA具身智能小车</span></div><div class="sponsors"><svg class="gowin" viewBox="50 490 1400 520" role="img" aria-label="GOWIN"><image href="/static/dashboard/gowin.jpeg" width="1509" height="1507"/></svg><span class="sponsor-divider"></span><img class="slogan" src="/static/dashboard/slogan.png" alt="芯辰大海 点亮未来"></div></header>
<main class="shell"><div id="mockBanner" class="mock" hidden>模拟演示模式</div><div class="dashboard">
<section class="card thermal-card" id="thermalCard" aria-labelledby="thermalHeading" data-warning="false">
<div class="card-heading"><div class="thermal-heading-title"><svg class="icon" aria-hidden="true"><use href="#thermometer"/></svg><h2 id="thermalHeading">红外热成像</h2></div><span class="live" id="thermalLive" data-live="false"><span class="dot"></span><span id="thermalLiveText">连接中</span></span><button type="button" id="thermalToggle" class="thermal-toggle" aria-pressed="false" aria-describedby="thermalHelp" disabled><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2v10M6.3 5.7a9 9 0 1 0 11.4 0"/></svg><span id="thermalToggleText">开启热成像</span></button><a id="thermalPreview" class="expand" href="#" target="_blank" rel="noopener" aria-label="在新标签页放大热成像"><svg class="icon" aria-hidden="true"><use href="#expand"/></svg>放大</a></div>
<div class="thermal-stage"><div class="heatmap" id="heatmapView"><canvas id="thermalCanvas" width="32" height="24" aria-label="实时热成像温度图"></canvas><span class="heatmap-label">实时热成像画面</span><span class="heatmap-crosshair" id="thermalCrosshair" hidden></span><div id="thermalWait" class="heatmap-wait"><svg class="icon" aria-hidden="true"><use href="#thermometer"/></svg><span id="thermalWaitText">等待实时温度画面</span></div></div><div class="thermal-scale" aria-label="当前画面自动色标"><div class="scale-bar"></div><div class="scale-labels"><span id="thermalHot">--°C</span><span id="thermalCold">--°C</span></div><span class="scale-note">自动色标</span></div></div>
<div class="thermal-metrics"><div class="maximum"><svg class="icon" aria-hidden="true"><use href="#thermometer"/></svg><span>最高温度</span><strong id="thermalMaximum">--°C</strong></div><div class="threshold-control"><svg class="icon" aria-hidden="true"><use href="#settings"/></svg><label for="thermalThreshold">报警阈值</label><select id="thermalThreshold" aria-describedby="thermalHelp thermalMessage" disabled><option value="40" selected>40°C</option><option value="50">50°C</option><option value="60">60°C</option></select></div></div>
<div id="thermalReading" class="thermal-reading" data-state="waiting" role="status" aria-live="polite"><svg class="icon" aria-hidden="true"><use href="#check"/></svg><span id="thermalReadingText">正在连接红外传感器</span></div>
<p id="thermalMessage" class="thermal-message" role="status" aria-live="polite"></p><p id="thermalHelp" class="thermal-footnote">32 × 24 原始热图 · 十字标记为最高温位置 · 测温达到阈值时，HDMI 左上角报警；新任务会关闭旧热像</p>
</section>
<section class="card task-card" aria-label="任务与小车控制">
<div class="control" aria-labelledby="taskHeading"><div class="card-heading"><svg class="icon" aria-hidden="true"><use href="#message"/></svg><h2 id="taskHeading">任务控制</h2></div><form id="taskForm"><label for="command">任务指令</label><div class="input-wrap"><svg class="icon input-target" aria-hidden="true"><use href="#lock"/></svg><textarea id="command" maxlength="200" placeholder="寻找绿色小球并移动到它附近" aria-describedby="notice charCount"></textarea><span id="charCount" class="counter">0/200</span></div><div class="actions"><button id="voiceButton" class="button voice" type="button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#mic"/></svg><span id="voiceLabel">语音输入</span></button><button id="sendButton" class="button primary" type="submit">发送任务<svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></button></div></form><p id="notice" class="notice" role="status" aria-live="polite"><svg class="icon" aria-hidden="true"><use href="#nav"/></svg><span id="noticeText">等待任务指令</span></p></div>
<section class="flow" aria-labelledby="flowHeading"><div class="card-heading"><svg class="icon" aria-hidden="true"><use href="#list"/></svg><h2 id="flowHeading">任务执行流程</h2></div><ol class="steps" id="steps"><li><span class="step-num">1</span>接收指令</li><li><span class="step-num">2</span>语义解析</li><li><span class="step-num">3</span>视觉搜索</li><li><span class="step-num">4</span>目标锁定</li><li><span class="step-num">5</span>自主接近</li></ol></section>
<section class="status" aria-labelledby="statusHeading"><div class="status-heading"><div class="card-heading"><svg class="icon" aria-hidden="true"><use href="#car"/></svg><h2 id="statusHeading">小车状态</h2></div><div id="connection" class="connection" data-connected="false" role="status"><span class="dot"></span><span id="connectionText">连接中</span></div></div><div class="status-bottom"><dl class="status-list"><div class="status-row"><svg class="icon" aria-hidden="true"><use href="#target"/></svg><dt>目标</dt><dd id="targetName" class="target">未设置</dd></div><div class="status-row"><svg class="icon" aria-hidden="true"><use href="#nav"/></svg><dt>运动状态</dt><dd id="motionState">待确认</dd></div><div class="status-row"><svg class="icon" aria-hidden="true"><use href="#wifi"/></svg><dt>通信状态</dt><dd id="communicationState">连接中</dd></div></dl><button class="button stop" id="stopButton" type="button" aria-label="立即发送停车指令"><svg class="icon" aria-hidden="true"><use href="#square"/></svg>立即停车</button></div><p class="status-detail"><span>目标识别：<strong id="recognitionState">待确认</strong></span><span>目标锁定：<strong id="lockState">待确认</strong></span></p><p id="state" class="status-message" role="status" aria-live="polite"></p></section>
</section></div></main>
<script>
'use strict';
const token=location.pathname.split('/').filter(Boolean)[0]||'',byId=id=>document.getElementById(id),box=byId('command');
let recognition=null,actionId=0,submitted=false;
const phases={thermal:'正在检测目标温度',arrival_pending:'等待目标到达确认',idle:'等待任务',understand:'正在理解任务',manual:'手动控制中',search:'正在寻找目标',turning:'正在转动寻找',querying:'正在识别目标',verify:'正在确认目标',select:'正在确认目标',track:'正在跟踪目标',approach:'正在靠近目标',following:'正在跟随目标',reacquire:'正在重新定位',found:'已找到目标',failed:'任务已暂停',stopped:'已停车',detect:'持续识别中'};
function count(){byId('charCount').textContent=box.value.length+'/'+box.maxLength}
function setNotice(text,kind=''){byId('noticeText').textContent=text;byId('notice').dataset.kind=kind}
async function api(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),3000);try{const r=await fetch(path,{...options,cache:'no-store',signal:controller.signal,headers:{'X-Task-Token':token,...options.headers}});if(r.status===403){const error=Error('访问已失效，请使用本次启动的网址重新打开');error.status=403;throw error;}const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data}finally{clearTimeout(timer)}}
function setFlow(step){const nodes=byId('steps').children;for(let i=0;i<nodes.length;i++){nodes[i].dataset.state=i+1<step?'complete':i+1===step?'active':'pending';if(i+1===step)nodes[i].setAttribute('aria-current','step');else nodes[i].removeAttribute('aria-current')}byId('steps').style.setProperty('--progress',Math.min(100,Math.max(0,(step-1)*25))+'%')}
async function sendText(text){text=text.trim();if(!text){setNotice('请先输入任务指令','error');box.focus();return}const id=++actionId,isStop=text==='停车';if(!isStop)byId('sendButton').disabled=true;setNotice(isStop?'正在发送停车指令…':'正在发送任务…');try{const d=await api('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(id===actionId){submitted=!isStop;setNotice(isStop?'停车指令已提交，请确认小车已停止':d.message||'任务已提交','success');setFlow(isStop?0:1)}}catch(e){if(id===actionId)setNotice('发送失败：'+(e.name==='AbortError'?'连接超时，请确认小车实际状态':e.message),'error')}finally{if(!isStop)byId('sendButton').disabled=false}}
function speak(){if(recognition){recognition.stop();return}if(!window.isSecureContext){setNotice('网页语音需要 localhost 或 HTTPS；也可使用键盘麦克风输入','error');box.focus();return}const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){setNotice('当前浏览器不支持语音输入，可使用键盘麦克风','error');box.focus();return}const rec=new Speech();recognition=rec;rec.lang='zh-CN';rec.interimResults=false;rec.maxAlternatives=1;let received=false,failed=false;rec.onstart=()=>{byId('voiceButton').setAttribute('aria-pressed','true');byId('voiceLabel').textContent='结束录音';setNotice('正在聆听…')};rec.onresult=e=>{received=true;box.value=e.results[0][0].transcript.slice(0,box.maxLength);count();setNotice('已转为文字，请核对后发送','success');box.focus()};rec.onerror=()=>{failed=true;setNotice('语音输入失败，请检查麦克风权限和浏览器语音服务','error')};rec.onend=()=>{recognition=null;byId('voiceButton').setAttribute('aria-pressed','false');byId('voiceLabel').textContent='语音输入';if(!received&&!failed)setNotice('未识别到语音，请重试')};try{rec.start()}catch(e){recognition=null;setNotice('无法启动麦克风，请检查权限','error')}}
function renderStatus(data){const phase=String(data.phase||'idle').toLowerCase(),terminal=['idle','stopped','failed','understand','reconnecting'].includes(phase),located=!terminal&&Array.isArray(data.bbox)&&data.bbox.length===4,locked=!terminal&&Boolean(data.fpga_lock&&data.fpga_lock!=='未锁定');byId('connection').dataset.connected='true';byId('connectionText').textContent='已连接';byId('targetName').textContent=data.target||'未设置';byId('targetName').classList.toggle('long',(data.target||'').length>7);byId('recognitionState').textContent=located?'已定位':'未定位';byId('recognitionState').className=located?'positive':'negative';byId('lockState').textContent=locked?'已锁定':'未锁定';byId('lockState').className=locked?'positive':'negative';const motion=data.motion_state||({manual:data.target==='停车'?'已停止':'手动行驶',turning:'转动搜索',approach:locked?'自主接近':'确认目标',following:locked?'跟随中':'等待目标'}[phase]||'已停止');byId('motionState').textContent=motion;const communication=data.communication_state||'正常';byId('communicationState').textContent=communication;byId('communicationState').className=communication==='正常'?'positive':'negative';byId('state').textContent=data.message||'';byId('mockBanner').hidden=!data.mock;let step={reconnecting:2,understand:2,search:3,turning:3,querying:3,detect:3,reacquire:3,verify:4,select:4,track:4,found:4,arrival_pending:5,thermal:6,approach:locked?5:4,following:locked?5:4}[phase]||0;if(!step&&submitted&&phase==='idle')step=1;if(['failed','stopped','manual'].includes(phase))submitted=false;setFlow(step);if(phase==='failed'&&data.message)setNotice(data.message,'error');byId('steps').title=data.state_text||phases[phase]||'等待任务'}
async function refresh(){const version=thermalVersion;try{const data=await api('/api/status');renderStatus(data);if(version===thermalVersion)renderThermal(data.thermal)}catch(e){byId('thermalToggle').disabled=true;byId('thermalThreshold').disabled=true;thermalUnavailable('任务连接中断，温度状态未更新');byId('connection').dataset.connected='false';byId('connectionText').textContent='已断开';byId('communicationState').textContent='已中断';byId('communicationState').className='negative';byId('recognitionState').textContent='待确认';byId('recognitionState').className='negative';byId('lockState').textContent='待确认';byId('lockState').className='negative';byId('motionState').textContent='待确认';byId('state').textContent=e.status===403?e.message:'连接中断，状态未更新，请确认小车实际状态';setFlow(0)}finally{setTimeout(refresh,500)}}



let thermalSaving=false,thermalControlSaving=false,thermalOpen=false,thermalVersion=0,thermalEnabled=false,frameAt=0;
const thermalCanvas=byId('thermalCanvas'),thermalCtx=thermalCanvas.getContext('2d');
const thermalColors=[[9,4,55],[24,18,184],[97,37,229],[209,39,177],[255,112,48],[255,240,74]];
function thermalColor(value){const at=Math.max(0,Math.min(1,value))*(thermalColors.length-1),i=Math.min(thermalColors.length-2,Math.floor(at)),f=at-i;return thermalColors[i].map((v,c)=>Math.round(v+(thermalColors[i+1][c]-v)*f))}
function thermalUnavailable(message='温度画面未更新，请检查传感器连接',state='error'){
 frameAt=0;thermalCanvas.style.visibility='hidden';byId('thermalWait').hidden=false;byId('thermalWaitText').textContent=message;byId('thermalCrosshair').hidden=true;
 byId('thermalLive').dataset.live='false';byId('thermalLiveText').textContent=state==='waiting'?'等待中':'未更新';
 byId('thermalMaximum').textContent='--°C';byId('thermalHot').textContent='--°C';byId('thermalCold').textContent='--°C';
 byId('thermalReading').dataset.state=state;byId('thermalReading').dataset.warning='false';byId('thermalReadingText').textContent=message;byId('thermalCard').dataset.warning='false';
}
function renderThermal(t){
 t=t||{};thermalEnabled=t.enabled===true;thermalOpen=t.control_mode==='manual'||t.task_active===true;byId('thermalToggle').disabled=!thermalEnabled||thermalControlSaving;byId('thermalToggle').dataset.open=String(thermalOpen);byId('thermalToggle').setAttribute('aria-pressed',String(thermalOpen));byId('thermalToggleText').textContent=thermalOpen?'关闭热成像':'开启热成像';byId('thermalThreshold').disabled=!thermalEnabled||thermalSaving;
 if(!thermalSaving&&[40,50,60].includes(t.threshold_c))byId('thermalThreshold').value=String(t.threshold_c);
 if(!thermalEnabled)thermalUnavailable('红外监测未启用','waiting');
 else if(!t.task_active)thermalUnavailable(t.control_mode==='off'?'热成像已关闭 · 点按钮开启测温':'温检待机 · 点按钮开启测温','waiting');
 else if(t.initializing)thermalUnavailable('正在初始化温检，请稍候','waiting');
 else if(t.sensor_valid!==true)thermalUnavailable('红外传感器未就绪，请检查接线和驱动');
}
function paintThermal(frame){
 const values=frame.pixels;
 if(frame.sensor_valid!==true||frame.width!==32||frame.height!==24||!Array.isArray(values)||values.length!==768||values.some(v=>!Number.isFinite(v))||!Number.isFinite(frame.age_ms)||frame.age_ms<0||frame.age_ms>800)throw Error('温度画面未更新，请检查传感器连接');
 const minimum=Math.min(...values),maximum=Math.max(...values),span=Math.max(1,maximum-minimum),image=thermalCtx.createImageData(32,24);
 values.forEach((value,i)=>image.data.set([...thermalColor((value-minimum)/span),255],i*4));thermalCtx.putImageData(image,0,0);
 const index=values.indexOf(maximum);byId('thermalCrosshair').style.left=((index%32+.5)/32*100)+'%';byId('thermalCrosshair').style.top=((Math.floor(index/32)+.5)/24*100)+'%';byId('thermalCrosshair').hidden=false;
 thermalCanvas.style.visibility='visible';byId('thermalWait').hidden=true;frameAt=performance.now()-frame.age_ms;
 byId('thermalMaximum').textContent=maximum.toFixed(1)+'°C';byId('thermalHot').textContent=(minimum+span).toFixed(1)+'°C';byId('thermalCold').textContent=minimum.toFixed(1)+'°C';
 byId('thermalLive').dataset.live='true';byId('thermalLiveText').textContent='实时';
 const warning=frame.warning===true;byId('thermalCard').dataset.warning=String(warning);byId('thermalReading').dataset.warning=String(warning);byId('thermalReading').dataset.state=warning?'warning':'normal';
 byId('thermalReadingText').textContent=warning?'检测到高温热源 · 高温报警':frame.control_mode==='manual'?'温度正常 · 温度监测中':'温度正常 · 任务温度监测中';
 renderThermal(frame);
}
async function refreshThermalFrame(){
 const version=thermalVersion,controller=new AbortController(),timer=setTimeout(()=>controller.abort(),1200);
 try{
  const response=await fetch('/api/thermal/frame',{headers:{'X-Task-Token':token},cache:'no-store',signal:controller.signal}),frame=await response.json();
  if(version!==thermalVersion)return;
  if(response.status===403)throw Error('访问已失效，请使用本次启动的网址重新打开');
  if(!response.ok||frame.frame_available!==true){renderThermal(frame);if(frame.enabled===true&&(frame.task_active===false||frame.initializing))return;throw Error(frame.enabled===false?'红外监测未启用':'暂无实时温度画面，请检查传感器连接')}
  paintThermal(frame);
 }catch(error){thermalUnavailable(error.name==='AbortError'?'温度画面连接超时，请检查网络':error.message)}
 finally{clearTimeout(timer);setTimeout(refreshThermalFrame,250)}
}
async function changeThermalThreshold(){
 const select=byId('thermalThreshold'),value=Number(select.value),message=byId('thermalMessage');thermalSaving=true;thermalVersion++;select.disabled=true;message.dataset.kind='';message.textContent='正在更新阈值…';
 try{const data=await api('/api/thermal/threshold',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({threshold_c:value})});select.value=String(data.threshold_c);message.textContent=data.message||'阈值已更新'}
 catch(e){message.dataset.kind='error';message.textContent='阈值更新失败：'+(e.name==='AbortError'?'连接超时，请等待状态刷新':e.message)}
 finally{thermalSaving=false;thermalVersion++;select.disabled=!thermalEnabled}
}

async function toggleManualThermal(){
 const message=byId('thermalMessage');thermalControlSaving=true;thermalVersion++;byId('thermalToggle').disabled=true;
 message.dataset.kind='';message.textContent=thermalOpen?'正在关闭热成像…':'正在开启热成像…';
 try{const data=await api('/api/thermal/manual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!thermalOpen})});thermalUnavailable(thermalOpen?'热成像已关闭':'正在初始化温度监测，请稍候','waiting');renderThermal(data.thermal);message.textContent=data.message}
 catch(e){message.dataset.kind='error';message.textContent='操作失败：'+(e.name==='AbortError'?'连接超时，请等待状态刷新':e.message)}
 finally{thermalControlSaving=false;thermalVersion++;byId('thermalToggle').disabled=!thermalEnabled}
}
byId('thermalToggle').addEventListener('click',toggleManualThermal);
byId('thermalPreview').href='/'+encodeURIComponent(token)+'/thermal';
byId('thermalThreshold').addEventListener('change',changeThermalThreshold);
setInterval(()=>{if(frameAt&&performance.now()-frameAt>1000)thermalUnavailable()},200);
refreshThermalFrame();
box.addEventListener('input',count);byId('taskForm').addEventListener('submit',e=>{e.preventDefault();if(!byId('sendButton').disabled)sendText(box.value)});box.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();byId('taskForm').requestSubmit()}});byId('voiceButton').addEventListener('click',speak);byId('stopButton').addEventListener('click',()=>sendText('停车'));setFlow(0);refresh();
</script></body></html>
