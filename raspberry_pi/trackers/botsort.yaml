# For ultralytics==8.4.159; keep actual weak detections, never start weak tracks.
tracker_type: botsort
track_high_thresh: 0.35
track_low_thresh: 0.1
new_track_thresh: 0.35
track_buffer: 30
match_thresh: 0.8
fuse_score: true
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: false
model: auto
# tracking.py additionally evicts IDs by elapsed time; 30 is not assumed FPS.
